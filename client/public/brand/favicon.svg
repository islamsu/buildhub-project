<!-- FAVICON. Same geometry, no padding: a browser tab renders at 16-20px, so
     the frame is pushed to the edges to buy every pixel of legibility. The
     centre node stays amber because at 16px it is the only thing that
     distinguishes this from a generic square outline. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1d4a7a"/>
  <g fill="#ffffff">
    <rect x="6"  y="7"  width="5"  height="18" rx="1.2"/>
    <rect x="21" y="7"  width="5"  height="18" rx="1.2"/>
    <rect x="11" y="7"  width="10" height="5"  rx="1.2"/>
    <rect x="11" y="20" width="10" height="5"  rx="1.2"/>
  </g>
  <rect x="13.5" y="13.5" width="5" height="5" rx="1.2" fill="#f0a44a"/>
</svg>
