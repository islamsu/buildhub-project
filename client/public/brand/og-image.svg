<!-- OPENGRAPH CARD, 1200x630.
     SVG rather than a raster: it is 2KB, renders identically at any scale, and
     carries no photography that would need licensing. Some social scrapers do
     not accept SVG for og:image - see the note in client/index.html, where a
     PNG export of this file is the one remaining asset decision. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#122c45"/>
      <stop offset="100%" stop-color="#1d4a7a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Structural grid, at low opacity. The same portal-frame motif as the
       mark, repeated as a pattern rather than as decoration. -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 160 H1200 M0 315 H1200 M0 470 H1200"/>
    <path d="M200 0 V630 M450 0 V630 M750 0 V630 M1000 0 V630"/>
  </g>

  <!-- The mark, at 96px -->
  <g transform="translate(96, 232) scale(3)">
    <g fill="#ffffff">
      <rect x="4"  y="5"  width="5"  height="22" rx="1.4"/>
      <rect x="23" y="5"  width="5"  height="22" rx="1.4"/>
      <rect x="9"  y="5"  width="14" height="5"  rx="1.4"/>
      <rect x="9"  y="22" width="14" height="5"  rx="1.4"/>
    </g>
    <rect x="13.5" y="13.5" width="5" height="5" rx="1.3" fill="#f0a44a"/>
  </g>

  <text x="232" y="296" font-family="Inter, system-ui, sans-serif" font-size="76"
        font-weight="700" fill="#ffffff" letter-spacing="-1.5">BuildHub</text>
  <text x="232" y="356" font-family="Inter, system-ui, sans-serif" font-size="30"
        font-weight="500" fill="#ffffff" fill-opacity="0.72">From sourcing to site.</text>
</svg>
