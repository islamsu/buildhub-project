<!doctype html>
<html lang="en" dir="ltr">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Rakiza — Construction sourcing, quotations and projects</title>
    <meta name="description" content="Source verified construction suppliers and professionals, request quotations, compare them side by side, and run the project from one place." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- PRIVATE BY DEFAULT. server/_core/seoHead.ts rewrites this per request
         and raises it to "index, follow" only for a path listed in
         shared/seo.ts AND only when the deployment is production. If that
         rewrite ever fails to run, the safe answer is the one already here. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── BRAND ASSETS ────────────────────────────────────────────────────
         PNG, not SVG, and that is a change from the previous mark.

         The RAKIZA mark is owner-supplied artwork - a faceted hexagon with
         shaded planes and an amber swoosh - rather than the geometric
         placeholder that preceded it, which was a handful of SVG rects. It is
         not reconstructible as paths without tracing it, which the owner
         explicitly forbade, so it ships as the raster it is. Every size here
         is derived from one master by scripts/brand/build-assets.py.

         THE TILE IS DELIBERATE. These are not the mark on transparency: they
         are the mark, inverted, on a navy rounded square. A navy mark on a
         transparent background disappears into dark browser chrome, which is
         the exact failure a favicon exists to prevent. The 32px file was
         inspected magnified before being trusted - the hexagon, the counter
         and the swoosh all still read at that size. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- Primary Navy #0F2D5B, the approved RAKIZA brand anchor, so the mobile
         browser chrome continues the header rather than sitting against it. -->
    <meta name="theme-color" content="#0F2D5B" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rakiza" />
    <meta property="og:title" content="Rakiza — Construction sourcing, quotations and projects" />
    <meta property="og:description" content="Source verified construction suppliers and professionals, request quotations, compare them side by side, and run the project from one place." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rakiza — Construction sourcing, quotations and projects" />
    <meta name="twitter:description" content="Source verified construction suppliers and professionals, request quotations, compare them side by side, and run the project from one place." />

    <!-- ── SOCIAL CARD ─────────────────────────────────────────────────────
         A real 1200x630 PNG. The previous card was an SVG with a standing
         owner note that several Slack and WhatsApp versions do not render
         SVG for og:image - so a shared link showed a bare title. That note is
         now closed: the card is composited from the brand master at the exact
         Open Graph dimensions.

         og:url is deliberately NOT hard-coded: the deployment serves staging
         and production from different hostnames, and a wrong canonical URL in
         a social card is worse than an absent one. server/_core/seoHead.ts
         rewrites per-request metadata and is where an absolute URL belongs. -->
    <meta property="og:image" content="/brand/rakiza-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rakiza — build together." />
    <meta name="twitter:image" content="/brand/rakiza-og.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
