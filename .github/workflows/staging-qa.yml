# ── Staging launch-readiness gate ──────────────────────────────────────────
#
# Runs the 22-point verification against the REAL deployed staging URL, in a
# real browser, from a GitHub runner.
#
# It runs here rather than from a developer machine for a specific reason: the
# runner can reach the deployment. The engineering sandbox this was written in
# is on a strict egress allowlist that returns 403 for every Render host, so it
# can build and test the artefact but can never probe the deployment. A runner
# has ordinary internet access, which makes this the mechanism that actually
# verifies staging.
#
# NOTHING HERE TOUCHES PRODUCTION. The harness refuses any URL that does not
# look like staging, and it registers accounts - which is why.

name: Staging QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging base URL, e.g. https://buildhub-staging.onrender.com"
        required: true
        type: string
      expect_commit:
        description: "Optional: the commit SHA staging should be serving. Set it and a mismatch FAILS the gate instead of being reported."
        required: false
        type: string
      ai_knowledge_suite:
        description: "Run the BuildHub knowledge-priority acceptance suite. TWELVE EXTRA PAID OpenAI requests. Off by default so routine runs cost one."
        required: false
        default: false
        type: boolean
  # DISPATCH ONLY - deliberately no `schedule:` trigger.
  #
  # This copy lives on the default branch so the workflow registers with
  # GitHub and gets a "Run workflow" button. A cron here would therefore be
  # live, and with no STAGING_BASE_URL repository variable set it would fail
  # every week by design (see "Resolve the target"), producing a standing red
  # X for a job that was never going to work. Add the schedule back when
  # staging is permanent and STAGING_BASE_URL is set.

concurrency:
  group: staging-qa
  cancel-in-progress: true

jobs:
  gate:
    name: 22-point staging gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # OFF, and load-bearing. setup-node@v5 turns package-manager caching
          # ON by default, then auto-detects the manager from package.json's
          # `packageManager` field - which says pnpm. This harness deliberately
          # never installs pnpm: it is standalone, and uses plain npm for the
          # one Playwright install below. So the action found pnpm in the
          # manifest, went looking for the binary, and failed the job before it
          # ever reached staging:
          #
          #   Unable to locate executable file: pnpm
          #
          # v4 did not cache unless asked, which is why the v4 -> v5 bump landed
          # green: this workflow has no push trigger, so nothing exercised it
          # until it was dispatched from main afterwards. ci.yml and
          # deploy-staging.yml are unaffected - both run pnpm/action-setup first.
          package-manager-cache: false

      - name: Resolve the target
        id: target
        run: |
          URL="${{ inputs.base_url || vars.STAGING_BASE_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::No staging URL. Pass base_url, or set the STAGING_BASE_URL repository variable."
            exit 1
          fi
          case "$URL" in
            *staging*|*onrender.com*) ;;
            *) echo "::error::$URL does not look like staging. This job registers accounts and must never point at production."; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Target: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright and its browser
        # --legacy-peer-deps is load-bearing, not cargo cult.
        #
        # This runs inside the repo checkout, so npm resolves BuildHub's whole
        # dependency tree before it can add anything. That tree has a genuine
        # peer conflict - @builder.io/vite-plugin-jsx-loc@0.1.1 declares a peer
        # of vite ^4 || ^5 while the project is on vite 7 - and npm's default
        # strict peer resolution aborts with ERESOLVE before Playwright is ever
        # fetched. The flag makes npm tolerate that pre-existing conflict for
        # THIS install only. It changes nothing about the project's own
        # dependencies: --no-save keeps package.json untouched and writes no
        # package-lock.json, and pnpm-lock.yaml is not consulted at all.
        #
        # Fixing the peer conflict itself is an application-dependency change
        # and deliberately out of scope for a QA harness.
        #
        # The version stays pinned so the harness is reproducible.
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.49.1
          npx playwright install --with-deps chromium

      # Cheap, and it invalidates everything else if it fails - so it runs
      # first and the expensive browser pass never starts on a dead deploy.
      - name: Smoke test
        run: node scripts/smoke.mjs "${{ steps.target.outputs.url }}"

      - name: Staging launch-readiness gate
        env:
          STAGING_ADMIN_USER: ${{ secrets.STAGING_ADMIN_USER }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          # Optional. Supplied -> a mismatch fails the gate. Absent -> the gate
          # still REPORTS the commit it tested, so the result is attributable
          # either way.
          STAGING_EXPECT_COMMIT: ${{ inputs.expect_commit }}
          STAGING_AI_KNOWLEDGE_SUITE: ${{ inputs.ai_knowledge_suite }}
        # `set -o pipefail` is LOAD-BEARING, not tidiness.
        #
        # `node ... | tee qa-output.txt` reports TEE's exit status, and tee
        # always succeeds. GitHub runs this with `bash -e`, which aborts on a
        # failing command but says nothing about a failing pipeline, so the step
        # exited 0 no matter what the gate concluded. The harness has always
        # exited 1 on a failed check - that value was simply thrown away.
        #
        # It never showed, because every run until now happened to have zero
        # failures. Run #13 was the first genuinely red gate, and it published
        # "171/173 checks passed" with two named FAILURES under a green tick.
        # A gate that cannot fail its own workflow is not a gate.
        run: |
          set -o pipefail
          node scripts/staging-qa.mjs "${{ steps.target.outputs.url }}" | tee qa-output.txt

      # Provenance belongs at the top of the summary, not buried in a log. A
      # green result against an unnamed build is not evidence of anything.
      - name: Record which build was tested
        if: always()
        run: |
          DEPLOYED=$(grep -oP '(?<=>>> DEPLOYED COMMIT: ).*' qa-output.txt | head -1 || true)
          {
            echo "### Build under test"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Deployed commit (reported by /version) | \`${DEPLOYED:-unknown}\` |"
            echo "| Expected commit (input) | \`${{ inputs.expect_commit || 'not supplied' }}\` |"
            echo "| Harness commit (this checkout) | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the result
        if: always()
        run: |
          {
            echo "## Staging QA"
            echo '```'
            tail -40 qa-output.txt 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-qa-output
          path: qa-output.txt
          retention-days: 30
