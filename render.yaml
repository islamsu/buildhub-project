# ── BuildHub staging on Render ─────────────────────────────────────────────
#
# A TEMPORARY, ISOLATED STAGING ENVIRONMENT. It does not replace the planned
# Vultr production architecture and shares nothing with it: its own database,
# its own secrets, its own bucket, its own data. No production credential
# appears here and none should ever be added.
#
# Render reads this file directly. In the dashboard: New -> Blueprint, pick this
# repository and the branch, and it provisions everything below. Nothing is
# clicked together by hand, so the environment is reproducible and reviewable.
#
# WHY MYSQL IS A PRIVATE SERVICE RATHER THAN A MANAGED DATABASE
#
# Render's managed database offering is PostgreSQL. BuildHub is MySQL - drizzle
# via mysql2, 19 migrations, and a schema verified against MySQL 8.0.46. Porting
# to Postgres would be exactly the architecture redesign this deployment is meant
# to avoid, and it would make staging a test of something production will never
# run. So MySQL 8 runs as a private service with a persistent disk: reachable
# only from inside the Render network, never from the internet.
#
# The trade-off is stated plainly: a private service with a disk has no managed
# backups, no failover and no patching. That is acceptable for a temporary
# staging environment holding only test data, and is NOT acceptable for
# production - which is why production stays on Vultr Managed Databases.

databases: []

services:
  # ── The application ──────────────────────────────────────────────────────
  - type: web
    name: buildhub-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt          # Closest of Render's regions to Egypt.
    branch: claude/phase4b-readiness-audit-hardening
    autoDeploy: true

    # Liveness, deliberately - not /readyz. A database blip must not make Render
    # kill and restart the container; it would restart forever while the
    # database is the thing that is down. /readyz exists for load-balancer
    # draining and is checked by the smoke suite instead.
    healthCheckPath: /healthz

    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT. The app binds exactly it in production or exits,
      # rather than scanning upward and leaving health checks pointed at nothing.
      - key: PORT
        value: 3000

      # Signs session JWTs. Generated by Render and never seen by anyone -
      # there is no way for a staging secret to be reused in production because
      # nobody ever holds it.
      - key: JWT_SECRET
        generateValue: true

      - key: APP_BASE_URL
        fromService:
          type: web
          name: buildhub-staging
          envVarKey: RENDER_EXTERNAL_URL

      # Points at the private MySQL service by its internal hostname. Not
      # reachable from the internet, so TLS to the database is not required on
      # this hop; production sets DATABASE_SSL=require against a managed
      # instance reached across a network.
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: buildhub-staging-mysql
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: disable

      - key: VITE_APP_ID
        value: buildhub-staging

      # Left unset on purpose. auth.capabilities then reports OAuth as
      # unavailable and the UI hides that door - first-party email and password
      # sign-in has been the primary path since Slice 3.
      - key: OAUTH_SERVER_URL
        value: ""

      # Object storage. Set these in the dashboard against a STAGING bucket to
      # exercise uploads; leave them empty and upload endpoints fail loudly
      # rather than silently pretending to store anything.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Outbound email. Unset means NullMailer: auth.capabilities reports
      # password reset as unavailable and the UI hides it, rather than offering
      # a button that can only fail.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      - key: OPENAI_API_KEY
        sync: false

  # ── MySQL 8, private ─────────────────────────────────────────────────────
  - type: pserv
    name: buildhub-staging-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    plan: starter
    region: frankfurt
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: buildhub
      - key: MYSQL_USER
        value: buildhub
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      # Assembled from the generated password so the credential exists in
      # exactly one place. The app consumes this via fromService above.
      - key: DATABASE_URL
        value: mysql://buildhub:$MYSQL_PASSWORD@buildhub-staging-mysql:3306/buildhub
